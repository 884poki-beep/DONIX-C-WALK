name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-latest already includes Android SDK; avoid sdkmanager setup failure.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DONIX-C-WALK-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DONIX-C-WALK-v1.0.0-APK
          path: DONIX-C-WALK-v1.0.0.apk
